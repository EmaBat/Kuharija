<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: block;
      }

      .sporocilo {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 32px;
        background: #f3e2b8;              /* pergament */
        border: 8px solid #8b5a2b;        /* lesen okvir */
        border-radius: 12px;
        box-shadow: 0 6px 0 #5c3a1a, 0 10px 20px rgba(0, 0, 0, 0.5);
        color: #4a2e12;
        font-family: Georgia, serif;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
        pointer-events: none;             /* klik gre skozi do igre */
      }
      
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="importmap">
      {
        "imports": {
          "gl-matrix": "/node_modules/gl-matrix/esm/index.js"
        }
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
